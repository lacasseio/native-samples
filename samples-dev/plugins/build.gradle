plugins {
    id 'java-gradle-plugin'
}

group = 'org.gradle.samples.plugins'

gradlePlugin {
    plugins {
        wrapper {
            id = 'org.gradle.samples.wrapper'
            implementationClass = 'org.gradle.samples.plugins.wrapper.WrapperPlugin'
        }
        generator {
            id = 'org.gradle.samples.generators'
            implementationClass = 'org.gradle.samples.plugins.generators.GeneratorPlugin'
        }

        copySource {
            id = 'dev.nokee.samples.copy-source'
            implementationClass = 'org.gradle.samples.plugins.generators.copysource.CopySourcePlugin'
        }
        readme {
            id = 'dev.nokee.samples.readme'
            implementationClass = 'org.gradle.samples.plugins.generators.readme.ReadMePlugin'
        }

        idea {
            id = 'org.gradle.samples.idea'
            implementationClass = 'org.gradle.samples.plugins.IdeaPlugin'
        }
    }

    dependencies {
        implementation 'org.eclipse.jgit:org.eclipse.jgit:5.0.2.201807311906-r'
        implementation 'commons-io:commons-io:2.6'
        implementation 'org.apache.commons:commons-lang3:3.8.1'
        implementation 'com.google.guava:guava:27.1-jre'
        implementation project(':external-build')
    }
}
